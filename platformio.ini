; ESP32 Thermal Imaging Camera
; PlatformIO project configuration

[platformio]
src_dir = firmware/esp32/src
include_dir = firmware/esp32/include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600

lib_deps =
    adafruit/Adafruit MLX90640@^1.1.2

build_flags =
    -DCORE_DEBUG_LEVEL=0
