; ESP32 Thermal Imaging Camera
; PlatformIO project configuration

[platformio]
src_dir = firmware/esp32/src
include_dir = firmware/esp32/include

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    sparkfun/SparkFun MLX90640 Thermal Imaging Camera@^1.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
